# GitHub Pages 자동 배포
# - 코드나 게시판 데이터(data/biz.json, public/data/resident.json)가 바뀌면 사이트를 다시 만들어 gh-pages 브랜치에 올립니다.
# - 저장소 Settings › Pages › Source 를 "Deploy from a branch: gh-pages / (root)" 로 두세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/magical-meitner-h496nk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Global-Mart
          NEXT_PUBLIC_SITE_URL: https://intoedu.github.io/Global-Mart
          NEXT_PUBLIC_DATA_BRANCH: ${{ github.ref_name }}
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
