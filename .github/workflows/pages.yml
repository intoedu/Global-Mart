# GitHub Pages 자동 배포
# - 소스 코드: claude/magical-meitner-h496nk 브랜치
# - 코드나 게시판 데이터(data/biz.json, public/data/resident.json)가 바뀌면 사이트를 다시 만들어
#   완성된 파일을 main 브랜치에 올립니다. (Settings › Pages › Source: main / (root))
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/magical-meitner-h496nk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Global-Mart
          NEXT_PUBLIC_SITE_URL: https://intoedu.github.io/Global-Mart
          NEXT_PUBLIC_DATA_BRANCH: ${{ github.ref_name }}
      - name: Add notes for the published branch
        run: |
          touch out/.nojekyll
          printf '%s\n' '# 글로벌마트 홈페이지 (배포본)' '' '이 브랜치(main)는 자동으로 만들어진 홈페이지 파일입니다. 직접 고치지 마세요.' '소스 코드와 게시판 데이터는 claude/magical-meitner-h496nk 브랜치에 있습니다.' > out/README.md
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: main
          commit_message: "Deploy site"
